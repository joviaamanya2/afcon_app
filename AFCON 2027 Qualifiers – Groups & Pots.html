<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AFCON 2027 Qualifiers – Groups & Pots</title>
<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141108;--ink:#fff3b0;--card:#221d0c;--line:#FFD60A;--mut:#c9b94f;--p1:#FFD60A;--p2:#fb923c;--p3:#2dd4bf;--p4:#a78bfa}}
:root[data-theme="dark"]{--bg:#141108;--ink:#fff3b0;--card:#221d0c;--line:#FFD60A;--mut:#c9b94f;--p1:#FFD60A;--p2:#fb923c;--p3:#2dd4bf;--p4:#a78bfa}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo Black","Arial Black",Impact,sans-serif;line-height:1.3}
.w{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:clamp(34px,8vw,72px);line-height:.95;margin:0;letter-spacing:-1px;text-transform:uppercase}
.sub{font-family:system-ui,sans-serif;font-weight:600;margin:8px 0 18px;color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.tabs{display:flex;border:3px solid var(--line);border-radius:12px;overflow:hidden}
.tabs button{font:inherit;font-size:14px;padding:10px 16px;background:transparent;color:var(--ink);border:0;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--line);color:var(--bg)}
input{flex:1;min-width:180px;font:600 15px system-ui,sans-serif;padding:11px 14px;border:3px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px dashed var(--ink);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;font:700 13px system-ui,sans-serif}
.legend span,.chip{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.p1{--c:var(--p1)}.p2{--c:var(--p2)}.p3{--c:var(--p3)}.p4{--c:var(--p4)}
.dot{background:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.g{background:var(--card);border:3px solid var(--line);border-radius:14px;overflow:hidden}
.g h2{margin:0;padding:8px 14px;background:var(--line);color:var(--bg);font-size:18px}
.t{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:2px solid color-mix(in srgb,var(--line) 20%,transparent);font-family:system-ui,sans-serif;font-weight:700;font-size:15px}
.t:first-of-type{border-top:0}
.fl{width:34px;height:23px;flex:none;border-radius:3px;box-shadow:0 0 0 1.5px color-mix(in srgb,var(--line) 45%,transparent);vertical-align:middle}td .fl{margin-right:10px}.t .n{flex:1}
.badge{font:800 11px system-ui,sans-serif;color:#fff;background:var(--c);padding:2px 8px;border-radius:99px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge{color:#141108}}
.pots{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px}
.pot{background:var(--card);border:3px solid var(--c);border-radius:14px;overflow:hidden}
.pot h2{margin:0;padding:10px 14px;background:var(--c);color:#fff;font-size:22px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pot h2{color:#141108}}
.t .gr{font-size:12px;color:var(--mut)}
.hide{display:none!important}.dim{opacity:.2}.hit{background:color-mix(in srgb,var(--c,var(--line)) 22%,transparent)}
.tw{overflow-x:auto;border:3px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:480px;font:700 14px system-ui,sans-serif}
th,td{padding:9px 14px;text-align:left;border-bottom:2px solid color-mix(in srgb,var(--line) 15%,transparent)}
th{background:var(--line);color:var(--bg);cursor:pointer;white-space:nowrap}
.cnt{font:700 13px system-ui,sans-serif;color:var(--mut);margin:0 0 10px}
</style>
</head>
<body>

<button role="tab" aria-selected="false" data-v="pots">Draw pots</button>
<button role="tab" aria-selected="false" data-v="table">Table</button>
</div>

</div>

<p class="cnt" id="cnt"></p>
<div id="groups" class="grid"></div>
<div id="pots" class="pots hide"></div>
<div id="table" class="tw hide"><table><thead><tr><th data-k="n">Team</th><th data-k="g">Group</th><th data-k="p">Pot</th></tr></thead><tbody></tbody></table></div>
</div>
